image:
  repository: ghcr.io/kennethlieyanto/twreport
  tag: latest

timezone: UTC

cronjobs:
  daily:
    enabled: true
    schedule: "0 9 * * *"
    type: daily
  weekly:
    enabled: true
    schedule: "0 9 * * 0"
    type: weekly
  monthly:
    enabled: true
    schedule: "0 9 1 * *"
    type: monthly
  quarterly:
    enabled: true
    schedule: "0 9 1 1,4,7,10 *"
    type: quarterly
  yearly:
    enabled: true
    schedule: "0 9 1 1 *"
    type: yearly

resendApiKey: "re_XXXXXXXXXXXXXXXXXXXXXXXX"

pvc:
  taskData: twreport-task-data

taskrc:
  newsVersion: "3.4.2"
  syncServerUrl: "https://taskchampion.example.com"

taskrcSecret:
  clientId: ""
  encryptionSecret: ""

appsettings:
  ReportConfig:
    Taskwarrior:
      Filter: "rc.context: status:completed -WAITING"
    Subjects:
      Daily: "TaskWarrior Daily Report - {date}"
      Weekly: "TaskWarrior Weekly Report - {date}"
      Monthly: "TaskWarrior Monthly Report - {date}"
      Quarterly: "TaskWarrior Quarterly Report - {date}"
      Yearly: "TaskWarrior Yearly Report - {date}"
    Resend:
      FromEmail: "mailer@example.com"
      FromName: "John Doe"
      ToEmail: "me@gmail.com"
