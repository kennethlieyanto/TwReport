apiVersion: batch/v1
kind: CronJob
metadata:
  name: twreport-daily
spec:
  schedule: "0 8 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: twreport
              image: twreport
              args: ["--type", "daily"]
              env:
                - name: RESEND_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: twreport-secrets
                      key: resend-api-key
              volumeMounts:
                - name: taskrc
                  mountPath: /etc/twreport/taskrc
                  subPath: taskrc
                  readOnly: true
                - name: taskrc-secret
                  mountPath: /etc/twreport/taskrc-secret
                  subPath: taskrc-secret
                  readOnly: true
                - name: task-data
                  mountPath: /root/.task
          volumes:
            - name: taskrc
              configMap:
                name: twreport-taskrc
            - name: taskrc-secret
              secret:
                secretName: twreport-taskrc-secret
            - name: task-data
              persistentVolumeClaim:
                claimName: twreport-task-data
          restartPolicy: OnFailure
---
